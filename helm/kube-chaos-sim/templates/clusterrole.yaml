{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-{{ .Release.Namespace }}-role
  labels:
    app.kubernetes.io/name: kube-chaos-sim
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  # Pod informer + kill-pod action
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # kubectl exec for inject-latency, memory-spike, cpu-stress
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Node informer (zone labels display)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Deployment for kubectl rollout restart
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  # HPA informer + create/patch from UI
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # PDB informer + create/patch from UI
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # metrics.k8s.io for CPU usage polling
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
{{- end }}
